<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Meeting Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: desk workbench. Sticky control bar (pricing date, calendar A vs B, paste-new-dates), tabbed work area below. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212e; --muted:#5b6778; --line:#d9dee6; --soft:#eaeef4;
  --accent:#1d4ed8; --accent-ink:#ffffff; --rich:#0f7a4a; --cheap:#b42318; --warn:#9a6700; --colA:#eef2fb; --colB:#eaf6ef;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --panel:#151c27; --ink:#e4e9f1; --muted:#93a0b4; --line:#273244; --soft:#1c2533;
  --accent:#7aa2ff; --accent-ink:#0b1220; --rich:#4cc38a; --cheap:#ff7a6b; --warn:#e3b341; --colA:#18223a; --colB:#16291f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --panel:#151c27; --ink:#e4e9f1; --muted:#93a0b4; --line:#273244; --soft:#1c2533;
  --accent:#7aa2ff; --accent-ink:#0b1220; --rich:#4cc38a; --cheap:#ff7a6b; --warn:#e3b341; --colA:#18223a; --colB:#16291f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
.wrap{padding-inline:16px;padding-block:0 32px;max-width:1500px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
@media (max-width:760px){header.bar{position:static}}
.bar-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
h1{font:600 20px/1.1 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
h1 small{display:block;font:400 12px var(--f-body);color:var(--muted);letter-spacing:0;margin-top:2px}
.brand{margin-right:auto;min-width:0}
label.f{display:flex;flex-direction:column;gap:2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,select,textarea,button{font:inherit;color:var(--ink)}
input[type=number],input[type=date],input[type=text],select{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-family:var(--f-mono);font-size:13px}
input[type=number]{width:90px}
textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;font:12px/1.5 var(--f-mono);resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px 10px;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.quick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px;align-items:start}
.quick textarea{min-height:38px;height:38px}
@media (max-width:760px){.quick{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 12px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:7px 11px;color:var(--muted);font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border-radius:999px;padding:3px 11px;font-size:12.5px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}
h2{font:600 15px/1.2 var(--f-display);letter-spacing:.02em;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 .tag{font:500 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:2px 0 8px;max-width:75ch}
.hint code,.method code{font-family:var(--f-mono);font-size:11.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
th{font:500 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel)}
td{font-family:var(--f-mono);font-size:12.5px}
th:first-child,td:first-child{text-align:left}
td.name{font-family:var(--f-body);font-weight:500;text-align:left}
td .sub{display:block;font:11px var(--f-mono);color:var(--muted);font-weight:400}
th.a,td.a{background:var(--colA)} th.b,td.b{background:var(--colB)}
.pos{color:var(--rich)} .neg{color:var(--cheap)} .err{color:var(--muted)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font:600 11px var(--f-body);letter-spacing:.04em}
.pill.buy{background:color-mix(in srgb,var(--rich) 16%,transparent);color:var(--rich)}
.pill.sell{background:color-mix(in srgb,var(--cheap) 16%,transparent);color:var(--cheap)}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel)}
.kpi b{display:block;font:500 17px var(--f-mono)}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.msg{font-size:12px;color:var(--muted);min-height:1em}
.msg.bad{color:var(--cheap)}
.scen td input{width:118px;border:1px solid transparent;background:transparent;padding:2px 3px;font:12px var(--f-mono);border-radius:3px}
.scen td input:hover,.scen td input:focus{border-color:var(--line);background:var(--bg)}
.scen th button{border:0;background:transparent;padding:0 3px;color:var(--muted)}
.scen th.sel{color:var(--accent)}
.cases td input{width:110px}
.method{font-size:12.5px;color:var(--muted);max-width:80ch}
.badge{font:500 11px var(--f-body);padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
<div class="wrap" style="padding-block:0">
  <div class="bar-row">
    <div class="brand"><h1>FF Meeting Calculator<small>ZQ · SR1 · SR3 fair values from the FOMC calendar, matching the Excel model</small></h1></div>
    <label class="f">Pricing date<input type="date" id="asof"></label>
    <label class="f">Calendar A (compare)<select id="selA"></select></label>
    <label class="f">Calendar B (priced)<select id="selB"></select></label>
    <label class="f">Alert edge bp<input type="number" id="thresh" step="0.25" min="0"></label>
  </div>
  <div class="quick">
    <textarea id="quickDates" spellcheck="false" placeholder="New FOMC dates announced? Paste them here (2027-01-27, Mar 16-17 2027, …) and calendar B reprices instantly"></textarea>
    <div class="row"><button class="primary" id="quickApply">Price new dates</button><span class="msg" id="quickMsg"></span></div>
  </div>
</div>
</header>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>
</div>

<script src="engine.js"></script>
<script src="seed.js"></script>
<script>
"use strict";
const E=FFEngine,U=E.util;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- defaults from the workbook ---------- */
const SEED=window.FF_SEED;
const MKT_TABLES=[
  ["ZQ_Out","ZQ outrights","Label, VWAP, settle. Feeds the SOFR path base, ZQ Live and Settle."],
  ["SR1_Out","SR1 outrights","SR3–SR1 Live and Settle."],
  ["SR3_Out","SR3 outrights","Quarterly. SR3 flys, SR3–SR1 and SR3–ZQ Live and Settle."],
  ["SR1ZQ","SR1−ZQ spread (bp)","Monthly SOFR−EFFR basis used in the SOFR path and the cases."],
  ["ZQ_MS","ZQ calendar spreads (bp)","Labels like Oct26-Nov26 Calendar. The implied move at each meeting comes from these."],
  ["ZQ_1MS","ZQ 1M spreads (bp)","Oct26 = Oct26–Nov26. Meeting-neutral Live and VWAP PnL."],
  ["SR3_3MS","SR3 3M spreads (bp)","Sep26 = Sep26–Dec26. Total Hikes for the auto Case 1 rows."]
];
const FAMILIES=[
  {k:"zq",name:"ZQ structures",kind:"binom",p:"zq",list:["Nov26-Dec26","Dec26-Jan27","Jan27-Feb27","Feb27-Mar27","Mar27-Apr27","Apr27-May27","May27-Jun27-Jul27","Apr27-May27-Jul27","Jul27-Aug27","Aug27-Sep27","Sep27-Oct27","Oct27-Nov27","Nov27-Dec27"]},
  {k:"ff",name:"FF 1M flys",kind:"binom",p:"zq",list:["Nov26-Dec26-Jan27","Dec26-Jan27-Feb27","Jan27-Feb27-Mar27","Feb27-Mar27-Apr27","Mar27-Apr27-May27","Apr27-May27-Jun27","May27-Jun27-Jul27","Jun27-Jul27-Aug27","Jul27-Aug27-Sep27","Aug27-Sep27-Oct27"]},
  {k:"sr3f",name:"SR3 flys",kind:"binom",p:"sr3",settle:true,list:["Dec26-Mar27-Jun27","Mar27-Jun27-Sep27","Jun27-Sep27-Dec27","Sep27-Dec27-Mar28","Dec27-Mar28-Jun28","Mar28-Jun28-Sep28"]},
  {k:"s31",name:"SR3–SR1",kind:"flyX",a:"sr3",b:"sr1",settle:true,list:["Jun26-Jul26-Aug26","Sep26-Oct26-Nov26","Dec26-Jan27-Feb27","Mar27-Apr27-May27","Jun27-Jul27-Aug27"]},
  {k:"s3z",name:"SR3–ZQ",kind:"flyX",a:"sr3",b:"zq",list:["Jun26-Jul26-Aug26","Sep26-Oct26-Nov26","Dec26-Jan27-Feb27","Mar27-Apr27-May27"]},
  {k:"s4",name:"SR3–ZQ 4-leg",kind:"four",list:["Sep26-Dec26-Oct26-Jan27","Sep26-Dec26-Nov26-Feb27","Dec26-Mar27-Jan27-Apr27","Dec26-Mar27-Feb27-May27","Mar27-Jun27-Apr27-Jul27","Mar27-Jun27-May27-Aug27","Jun27-Sep27-Jul27-Oct27","Jun27-Sep27-Aug27-Nov27","Sep27-Dec27-Oct27-Jan28","Sep27-Dec27-Nov27-Feb28"]},
  {k:"mn",name:"Meeting neutrals",kind:"mn",list:null}
];
const fmtNum=v=>v==null?"":String(+(+v).toFixed(10));
function tableText(rows){return rows.map(r=>[r.label,r.vwap==null?"":r.vwap==="NaN"?"NaN":fmtNum(r.vwap),r.settle==null?"":fmtNum(r.settle)].join("\t")).join("\n")}
function defaults(){
  return{
    asof:"", // empty = today's date, like TODAY() in the workbook
    thresh:0.5, pnlMult:41.67, vwapMult:40.96,
    confirmed:SEED.confirmed.join("\n"),
    scen:JSON.parse(JSON.stringify(SEED.scenarios)), order:Object.keys(SEED.scenarios), selB:SEED.selected, selA:SEED.selected,
    cases:JSON.parse(JSON.stringify(SEED.cases)),
    mkt:Object.fromEntries(MKT_TABLES.map(([k])=>[k,tableText(SEED.mkt[k]||[])])),
    sofr:SEED.sofr.map(r=>r.join("\t")).join("\n"), effr:SEED.effr.map(r=>r.join("\t")).join("\n"),
    holidays:SEED.holidays.join("\n"),
    lists:Object.fromEntries(FAMILIES.filter(f=>f.list).map(f=>[f.k,f.list.join("\n")])),
    tab:"strat", fam:"zq", matrixFam:"zq"
  };
}
const KEY="ff-meeting-calc-v2";
let S;
try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){S=defaults()}
let saveT=0;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},400)};

/* ---------- parsing ---------- */
const MONS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseDateLoose(p,refYear){
  const v=U.fromText(p); if(v!=null)return v;
  const low=p.toLowerCase();let mon=-1,pos=-1;
  MONS.forEach((mm,i)=>{const re=new RegExp("\\b"+mm,"g");let r;while((r=re.exec(low))){if(r.index>pos){pos=r.index;mon=i}}});
  const yr=/\b(20\d{2})\b/.exec(p);const nums=(p.replace(/\b20\d{2}\b/,"").match(/\b\d{1,2}\b/g)||[]).map(Number);
  if(mon>=0&&nums.length)return U.ser(yr?+yr[1]:refYear,mon+1,nums[nums.length-1]);
  return null;
}
function parseDateList(text,refYear){
  const out=[],bad=[];let y=refYear;
  text.split(/\n|;|(?<=\d{4})\s*,|,(?=\s*\d{4}-)/).map(s=>s.trim()).filter(Boolean).forEach(p=>{const d=parseDateLoose(p,y);if(d!=null&&!isNaN(d)){out.push(d);y=U.parts(d).y}else bad.push(p)});
  return{dates:[...new Set(out)].sort((a,b)=>a-b),bad};
}
function splitRow(l){return l.includes("\t")?l.split("\t"):l.includes(",")?l.split(","):l.trim().split(/\s{2,}|\s(?=[-\d.]|NaN)/)}
const memo=new Map();
function parseTable(text){
  if(memo.has(text))return memo.get(text);
  const lines=text.split(/\r?\n/).filter(l=>l.trim());let hdr=null;const rows=[];
  const h0=lines.length?splitRow(lines[0]).map(s=>s.trim().toLowerCase()):[];
  if(h0.some(h=>/vwap|bidprice|askprice|settle/.test(h))){hdr=h0;lines.shift()}
  const idx=n=>hdr?hdr.findIndex(h=>h.replace(/[^a-z]/g,"")===n):-1;
  const iV=hdr?hdr.findIndex(h=>h.includes("vwap")):1,iS=hdr?hdr.findIndex(h=>h.startsWith("settle")):2;
  const iB=idx("bidprice"),iA=idx("askprice"),iBq=idx("bidquantity"),iAq=idx("askquantity"),iIB=idx("impliedbidquantity"),iIA=idx("impliedaskquantity");
  const nz=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
  for(const l of lines){
    const c=splitRow(l).map(s=>s.trim());if(!c[0])continue;
    let v=iV>=0?c[iV]:"";
    if((v===undefined||v===""||isNaN(+v))&&iB>=0&&iA>=0&&c[iB]&&c[iA]&&!isNaN(+c[iB])&&!isNaN(+c[iA])){
      const bq=nz(c[iBq])+nz(c[iIB]),aq=nz(c[iAq])+nz(c[iIA]);
      v=bq+aq>0?(+c[iB]*aq+bq*+c[iA])/(bq+aq):(+c[iB]+ +c[iA])/2;
    }
    rows.push({label:c[0].replace(/\s+/g," "),vwap:v===undefined?"":v,settle:iS>=0&&c[iS]!==undefined?c[iS]:""});
  }
  memo.set(text,rows);return rows;
}
function parseFix(text){
  const k="fx:"+text;if(memo.has(k))return memo.get(k);
  const out=[];text.split(/\r?\n/).forEach(l=>{const c=l.trim().split(/[\t,;]+|\s+(?=-?\d+(?:\.\d+)?$)/);if(c.length<2)return;const d=parseDateLoose(c[0],2026);const v=parseFloat(c[c.length-1]);if(d!=null&&!isNaN(v))out.push([d,v])});
  memo.set(k,out);return out;
}

/* ---------- engine inputs ---------- */
const todaySerReal=()=>{const t=new Date();return U.ser(t.getFullYear(),t.getMonth()+1,t.getDate())};
function todaySer(){if(S.asof){const v=U.fromText(S.asof);if(v!=null)return v}return todaySerReal()}
const cv=v=>v==="auto"?"auto":(v===""||v==null||isNaN(+v)?undefined:+v);
function inputs(){
  return{today:todaySer(),confirmed:parseDateList(S.confirmed,2024).dates,
    mkt:Object.fromEntries(MKT_TABLES.map(([k])=>[k,parseTable(S.mkt[k]||"")])),
    sofr:parseFix(S.sofr),effr:parseFix(S.effr),holidays:parseDateList(S.holidays,2023).dates,
    cases:{rows:S.cases.rows.map(r=>({c1:cv(r.c1),c2:cv(r.c2)})),extra:S.cases.extra.map(r=>({date:U.fromText(r.date||""),c1:cv(r.c1),c2:cv(r.c2)})),cutoff:U.fromText(S.cases.cutoff||"")||0}};
}
const scenDates=name=>(S.scen[name]||[]).filter(Boolean).map(d=>parseDateLoose(String(d),2027)).filter(d=>d!=null);
const cache=new Map();let inpKey="",INP=null,lastMs=0;
function result(name){
  if(!cache.has(name)){const t=performance.now();cache.set(name,E.run(INP,scenDates(name)));lastMs=performance.now()-t}
  return cache.get(name);
}

/* ---------- strategy values ---------- */
const getter=(R,p,w)=>w==="live"?R.src[p+"Live"]:w==="settle"?R.src[p+"Settle"]:w==="fair"?R.src[p+"Fair"]:R.src[p+"Case"](w==="c1"?0:1);
function famItems(f,RB){
  if(f.kind!=="mn")return(S.lists[f.k]||"").split(/\n/).map(s=>s.trim()).filter(Boolean).map(l=>({label:l}));
  return RB.mn.map(m=>({label:m.legs.join("-"),legs:m.legs,ratios:m.ratios,meeting:m.meeting}));
}
function value(f,it,R,w){
  try{
    if(f.kind==="binom")return E.binom(it.label,getter(R,f.p,w));
    if(f.kind==="flyX")return E.flyX(it.label,getter(R,f.a,w),getter(R,f.b,w));
    if(f.kind==="four")return E.four(it.label,getter(R,"sr3",w),getter(R,"zq",w));
    if(f.kind==="mn"){
      if(w==="live"){ // Graphs F25: 1M spreads weighted [a, a+b]
        const sp=[it.ratios[0],it.ratios[0]+it.ratios[1]];let v=sp[0]*R.src.zq1ms(it.legs[0])+sp[1]*R.src.zq1ms(it.legs[1]);
        if(isNaN(v))v=100*E.ratioSum(it.legs,it.ratios,R.src.zqLive);return v;}
      return 100*E.ratioSum(it.legs,it.ratios,getter(R,"zq",w));
    }
  }catch(e){return NaN}
  return NaN;
}
const hasSettle=f=>f.settle||f.kind==="mn"||(f.kind==="binom"&&f.p==="zq");

/* ---------- formatting ---------- */
const bad=v=>v==null||typeof v!=="number"||!isFinite(v);
const z=v=>Math.abs(v)<5e-7?0:v;
const fx=(v,d)=>bad(v)?'<span class="err">—</span>':z(v).toFixed(d);
const sg=(v,d)=>{if(bad(v))return'<span class="err">—</span>';const t=z(v).toFixed(d);return(+t>0?"+":"")+(+t===0?(0).toFixed(d):t)};
const cl=v=>bad(v)||Math.abs(v)<5e-4?"":v>0?"pos":"neg";
const dname=d=>{const p=U.parts(d);return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][p.w]} ${U.isoTime(d)}`};
const cellsOut=r=>r.map(v=>typeof v==="number"?(isFinite(v)?v.toFixed(5):""):v);

/* ---------- views ---------- */
const TABS=[["strat","Strategies"],["out","Outrights"],["matrix","Scenario matrix"],["meet","Meetings & cases"],["mkt","Market data"],["set","Structures & settings"],["about","Method"]];
let lastCopy=null;
function render(){
  const key=JSON.stringify([S.asof,S.confirmed,S.scen,S.cases,S.mkt,S.sofr,S.effr,S.holidays,todaySerReal()]);
  if(key!==inpKey){inpKey=key;INP=inputs();cache.clear()}
  if(!S.scen[S.selB])S.selB=S.order[0];if(!S.scen[S.selA])S.selA=S.order[0];
  $("asof").value=S.asof||U.iso(todaySer());$("thresh").value=S.thresh;
  for(const id of ["selA","selB"])$(id).innerHTML=S.order.map(n=>`<option ${S[id]===n?"selected":""}>${esc(n)}</option>`).join("");
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
  const RA=result(S.selA),RB=result(S.selB);lastCopy=null;
  ({strat:viewStrat,out:viewOut,matrix:viewMatrix,meet:viewMeet,mkt:viewMkt,set:viewSet,about:viewAbout})[S.tab](RA,RB);
  save();
}
const sameAB=()=>S.selA===S.selB?` <span class="badge">A and B are the same calendar</span>`:"";
const copyRow=label=>`<div class="row" style="margin-top:8px"><button id="copyView">${label}</button><span class="msg" id="copyMsg"></span></div>`;

function kpis(RB,rows){
  const th=+S.thresh,flags=rows.filter(r=>!bad(r.edge)&&Math.abs(r.edge)>=th).length;
  const big=rows.filter(r=>!bad(r.d)&&r.f.kind!=="mn").sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))[0];
  const m0=RB.rows[0];
  return `<div class="kpis">
    <div class="kpi"><b>${m0?U.iso(m0.date)+" · "+sg(m0.cut,2):"—"}</b><span>Next meeting · implied bp (B)</span></div>
    <div class="kpi"><b>${big?sg(big.d,2):"—"}</b><span>Largest A→B change${big?" · "+esc(big.label):""}</span></div>
    <div class="kpi"><b>${flags}</b><span>Structures with edge ≥ ${th}bp (B)</span></div>
    <div class="kpi"><b>${fx(RB.P8,2)}</b><span>Total hikes for auto Case 1</span></div>
  </div>`;
}
function stratRows(f,RA,RB){
  return famItems(f,RB).map(it=>{
    const live=value(f,it,RB,"live"),settle=hasSettle(f)?value(f,it,RB,"settle"):NaN,a=value(f,it,RA,"fair"),b=value(f,it,RB,"fair");
    return{f,it,label:it.label,live,settle,a,b,d:b-a,edge:b-live,c1:value(f,it,RB,"c1"),c2:value(f,it,RB,"c2")};
  });
}
function stratTable(rows,showFam){
  const th=+S.thresh,anyS=rows.some(r=>!bad(r.settle)),mn=rows.some(r=>r.f.kind==="mn");
  let h=`<div class="tbl-wrap"><table><thead><tr><th>Structure</th><th>Live</th>${anyS?"<th>Settle</th>":""}<th class="a">Fair A</th><th class="b">Fair B</th><th>A→B</th><th>Edge B</th><th>Hike 1 (B)</th><th>Hike 2 (B)</th>${mn?"<th>VWAP PnL</th><th>Edge PnL</th>":""}<th>Signal</th></tr></thead><tbody>`;
  for(const r of rows){const flag=!bad(r.edge)&&Math.abs(r.edge)>=th;
    const sub=showFam?r.f.name:r.it.ratios?`ratios ${r.it.ratios.join(" / ")} · meeting ${U.iso(r.it.meeting)}`:"";
    const isMn=r.f.kind==="mn";
    h+=`<tr class="${flag?"flag":""}"><td class="name">${esc(r.label)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</td><td>${fx(r.live,3)}</td>${anyS?`<td>${fx(r.settle,3)}</td>`:""}<td class="a">${fx(r.a,3)}</td><td class="b">${fx(r.b,3)}</td><td class="${cl(r.d)}">${sg(r.d,3)}</td><td class="${cl(r.edge)}">${sg(r.edge,3)}</td><td>${fx(r.c1,3)}</td><td>${fx(r.c2,3)}</td>${mn?`<td>${isMn?fx(r.live*S.vwapMult,0):""}</td><td class="${isMn?cl(r.edge):""}">${isMn?sg(r.edge*S.pnlMult,0):""}</td>`:""}<td>${flag?(r.edge>0?'<span class="pill buy">BUY</span>':'<span class="pill sell">SELL</span>'):""}</td></tr>`}
  return h+"</tbody></table></div>";
}
function viewStrat(RA,RB){
  const all=FAMILIES.flatMap(f=>stratRows(f,RA,RB));
  const fam=S.fam==="all"?null:(FAMILIES.find(f=>f.k===S.fam)||FAMILIES[0]);
  const rows=fam?stratRows(fam,RA,RB):all.filter(r=>!bad(r.d)&&r.f.kind!=="mn").sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,40);
  $("view").innerHTML=kpis(RB,all)+`<section class="card">
    <div class="chips">${FAMILIES.map(f=>`<button data-fam="${f.k}" aria-pressed="${S.fam===f.k}">${f.name}</button>`).join("")}<button data-fam="all" aria-pressed="${S.fam==="all"}">Biggest A→B changes</button></div>
    <p class="hint">Values in bp of price, as on the Graphs sheet. <b>Fair A/B</b> = model fair under calendar A/B. <b>Edge B</b> = Fair B − Live; positive means the structure is cheap. <b>Hike 1/2</b> = Case 1/2 under calendar B.${fam?"":" Meeting neutrals are left out of this ranking because their day-count ratios scale them up; see their own tab."}${fam&&fam.kind==="mn"?" Structures are built from calendar B's meetings, so Fair A shows the same B-neutral structure priced on calendar A.":""}${sameAB()}</p>
    ${stratTable(rows,!fam)}${copyRow("Copy table")}</section>`;
  lastCopy=()=>[["Structure","Live","Settle","FairA","FairB","AtoB","EdgeB","Hike1","Hike2"]].concat(rows.map(r=>cellsOut([r.label,r.live,r.settle,r.a,r.b,r.d,r.edge,r.c1,r.c2])));
}
function viewOut(RA,RB){
  const prods=[["zq","ZQ","ZQ_Out"],["sr1","SR1","SR1_Out"],["sr3","SR3","SR3_Out"]];
  const pc=U.parseLab(U.lab(INP.today)),out=[];
  let h=`<p class="hint">Outright fair prices. ZQ = average of last EFFR plus cumulative implied moves. SR1 = monthly average of the SOFR path. SR3 = SOFR path compounded over business days, 3rd Wednesday to 3rd Wednesday. Spreads to live are in bp.${sameAB()}</p><div class="cols">`;
  for(const[p,name,t] of prods){
    const have=new Set(INP.mkt[t].map(r=>r.label));
    const labels=RB.months.filter(l=>{const pl=U.parseLab(l);return have.has(l)&&pl.y*12+pl.m>=pc.y*12+pc.m-(p==="sr3"?3:0)});
    h+=`<section class="card"><h2>${name}</h2><div class="tbl-wrap"><table><thead><tr><th>Contract</th><th>Live</th><th class="a">Fair A</th><th class="b">Fair B</th><th>A→B</th><th>Edge</th><th>Case 1</th><th>Case 2</th></tr></thead><tbody>`;
    for(const l of labels){const live=RB.src[p+"Live"](l),a=RA.src[p+"Fair"](l),b=RB.src[p+"Fair"](l),c1=RB.src[p+"Case"](0)(l),c2=RB.src[p+"Case"](1)(l);
      h+=`<tr><td class="name">${name} ${l}</td><td>${fx(live,4)}</td><td class="a">${fx(a,4)}</td><td class="b">${fx(b,4)}</td><td class="${cl(b-a)}">${sg((b-a)*100,2)}</td><td class="${cl(b-live)}">${sg((b-live)*100,2)}</td><td>${fx(c1,4)}</td><td>${fx(c2,4)}</td></tr>`;
      out.push([name+" "+l,live,a,b,c1,c2])}
    h+="</tbody></table></div></section>";
  }
  $("view").innerHTML=h+"</div>"+copyRow("Copy all outrights");
  lastCopy=()=>[["Contract","Live","FairA","FairB","Case1","Case2"]].concat(out.map(cellsOut));
}
function viewMatrix(RA,RB){
  const fam=FAMILIES.find(f=>f.k===S.matrixFam)||FAMILIES[0];
  const t=performance.now();const Rs=S.order.map(n=>[n,result(n)]);const ms=performance.now()-t;
  const items=famItems(fam,RB),out=[];
  let h=`<section class="card"><div class="chips">${FAMILIES.map(f=>`<button data-mfam="${f.k}" aria-pressed="${fam.k===f.k}">${f.name}</button>`).join("")}</div>
  <p class="hint">Fair value of each structure under every calendar scenario, so you know before the announcement what each outcome is worth. Colour shows the sign of fair − live.${fam.kind==="mn"?" Meeting-neutral structures are taken from calendar B.":""}</p>
  <div class="tbl-wrap"><table><thead><tr><th>Structure</th><th>Live</th>${Rs.map(([n])=>`<th class="${n===S.selB?"b":n===S.selA?"a":""}">${esc(n)}</th>`).join("")}<th>Range</th></tr></thead><tbody>`;
  for(const it of items){const live=value(fam,it,RB,"live");const vals=Rs.map(([,R])=>value(fam,it,R,"fair"));const ok=vals.filter(v=>!bad(v));
    h+=`<tr><td class="name">${esc(it.label)}</td><td>${fx(live,3)}</td>${vals.map((v,i)=>`<td class="${Rs[i][0]===S.selB?"b ":Rs[i][0]===S.selA?"a ":""}${cl(v-live)}">${fx(v,3)}</td>`).join("")}<td>${ok.length?fx(Math.max(...ok)-Math.min(...ok),3):'<span class="err">—</span>'}</td></tr>`;
    out.push([it.label,live,...vals])}
  $("view").innerHTML=h+`</tbody></table></div>${copyRow("Copy matrix")}<p class="msg">${S.order.length} calendars priced in ${Math.max(1,Math.round(ms))} ms</p></section>`;
  lastCopy=()=>[["Structure","Live",...S.order]].concat(out.map(cellsOut));
}
function cutsTable(R,title,cls){
  let h=`<h2>${title}</h2><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Meeting</th><th>ZQ spread</th><th>Spread VWAP</th><th class="${cls}">Implied bp</th><th>Cumulative</th></tr></thead><tbody>`;
  let c=0;R.rows.forEach((r,i)=>{c+=bad(r.cut)?0:r.cut;h+=`<tr><td>${i+1}</td><td class="name">${dname(r.date)}</td><td>${esc(r.con.replace(" Calendar",""))}</td><td>${fx(r.E,3)}</td><td class="${cls} ${cl(r.cut)}">${sg(r.cut,3)}</td><td>${sg(c,2)}</td></tr>`});
  return h+"</tbody></table></div>";
}
function viewMeet(RA,RB){
  const maxRows=Math.max(8,...S.order.map(n=>(S.scen[n]||[]).length+1));
  let grid=`<div class="tbl-wrap"><table class="scen"><thead><tr><th>#</th>${S.order.map(n=>`<th class="${n===S.selB?"sel":""}">${esc(n)}<button data-delscen="${esc(n)}" aria-label="Delete ${esc(n)}">×</button></th>`).join("")}</tr></thead><tbody>`;
  for(let i=0;i<maxRows;i++)grid+=`<tr><td>${i+1}</td>${S.order.map(n=>`<td><input type="text" data-scen="${esc(n)}" data-i="${i}" value="${esc((S.scen[n]||[])[i]||"")}" aria-label="${esc(n)} meeting ${i+1}"></td>`).join("")}</tr>`;
  grid+="</tbody></table></div>";
  const used=(isExtra,r,i)=>{const cr=RB.caseRows.find(c=>isExtra?c.date===U.fromText(r.date||""):c.date===RB.MC[i]);return cr?`${fx(+cr.c[0],3)} / ${fx(+cr.c[1],3)}`:""};
  const caseRow=(r,i,isExtra)=>`<tr><td class="name">${isExtra?`<input type="date" data-cx="${i}" data-k="date" value="${esc(r.date||"")}" aria-label="Extra case date">`:(RB.MC[i]?dname(RB.MC[i]):"—")}</td>
    <td><input type="text" data-c${isExtra?"x":"r"}="${i}" data-k="c1" value="${esc(r.c1??"")}" aria-label="Hike 1"></td><td><input type="text" data-c${isExtra?"x":"r"}="${i}" data-k="c2" value="${esc(r.c2??"")}" aria-label="Hike 2"></td><td>${used(isExtra,r,i)}</td></tr>`;
  $("view").innerHTML=`<div class="cols">
   <section class="card">${cutsTable(RA,"Calendar A · "+esc(S.selA),"a")}</section>
   <section class="card">${cutsTable(RB,"Calendar B · "+esc(S.selB),"b")}</section></div>
   <section class="card" style="margin-top:14px"><h2>Calendar scenarios <span class="tag">Graphs AH38:AO44</span></h2>
   <p class="hint">Each column is one possible calendar. The page takes the confirmed dates before a scenario's first date, then the scenario's dates, then extends with the rolling average of the last five gaps (Graphs B49:B66). Edit a cell and press Tab or Enter to reprice.</p>
   ${grid}<div class="row" style="margin-top:8px"><input type="text" id="newScen" placeholder="Scenario name" aria-label="New scenario name"><button id="addScen">Add scenario</button></div></section>
   <div class="cols" style="margin-top:14px">
   <section class="card"><h2>Confirmed meeting dates <span class="tag">Raw Data AU4:AU27</span></h2><textarea id="confirmed" rows="10" spellcheck="false">${esc(S.confirmed)}</textarea></section>
   <section class="card"><h2>Case 1 / Case 2 hikes <span class="tag">Graphs B32:D40</span></h2>
   <p class="hint">Rows follow calendar B's meeting order. Type bp, or <code>auto</code> to split Total Hikes (${fx(RB.P8,3)}bp) with weights n…1 like C34:C39. Extra rows use fixed dates.</p>
   <div class="tbl-wrap"><table class="cases"><thead><tr><th>Meeting (B)</th><th>Hike 1</th><th>Hike 2</th><th>Used</th></tr></thead><tbody>
   ${S.cases.rows.map((r,i)=>caseRow(r,i,false)).join("")}${S.cases.extra.map((r,i)=>caseRow(r,i,true)).join("")}</tbody></table></div>
   <div class="row" style="margin-top:8px"><label class="f">Total-hikes cutoff<input type="date" id="cutoff" value="${esc(S.cases.cutoff||"")}"></label><button id="addCase">Add meeting row</button><button id="addExtra">Add extra date</button></div></section></div>`;
}
function viewMkt(){
  const lastOf=a=>a.length?U.iso(Math.max(...a.map(r=>r[0]))):"—";
  $("view").innerHTML=`<p class="hint">Paste each table straight from your feed or the Raw Data sheet, then click outside the box. A header row with <code>bidPrice</code>, <code>askPrice</code>, quantities and <code>VWAP</code> is understood; without a header the columns are label, VWAP, settle. When VWAP is blank, the size-weighted mid is computed from bid, ask and quantities, as in the workbook.</p>
  <div class="cols">${MKT_TABLES.map(([k,n,d])=>`<section class="card"><h2>${n} <span class="tag">${k}</span></h2><p class="hint">${esc(d)}</p><textarea data-mkt="${k}" rows="8" spellcheck="false">${esc(S.mkt[k]||"")}</textarea><div class="msg">${INP.mkt[k].length} rows read</div></section>`).join("")}
  <section class="card"><h2>SOFR fixings <span class="tag">rate table</span></h2><textarea id="sofr" rows="8" spellcheck="false">${esc(S.sofr)}</textarea><div class="msg">${INP.sofr.length} fixings · last ${lastOf(INP.sofr)}</div></section>
  <section class="card"><h2>EFFR fixings <span class="tag">rate__2 table</span></h2><textarea id="effr" rows="8" spellcheck="false">${esc(S.effr)}</textarea><div class="msg">${INP.effr.length} fixings · last ${lastOf(INP.effr)}</div></section>
  <section class="card"><h2>Holidays <span class="tag">SR3-SR1 BF column</span></h2><textarea id="holidays" rows="8" spellcheck="false">${esc(S.holidays)}</textarea><div class="msg">${INP.holidays.length} dates</div></section></div>`;
}
function viewSet(){
  $("view").innerHTML=`<div class="cols">${FAMILIES.filter(f=>f.list).map(f=>`<section class="card"><h2>${f.name}</h2><p class="hint">${f.kind==="binom"?"Months joined by -. Weights follow the binomial row: 2 legs 1/−1, 3 legs 1/−2/1, 4 legs 1/−3/3/−1.":f.kind==="flyX"?"2 × SR3(leg 1) − leg 2 − leg 3.":"SR3(1) − SR3(2) − ZQ(3) + ZQ(4)."}</p><textarea data-list="${f.k}" rows="8" spellcheck="false">${esc(S.lists[f.k]||"")}</textarea></section>`).join("")}
  <section class="card"><h2>PnL multipliers</h2><div class="row"><label class="f">Edge PnL $/bp<input type="number" id="pnlMult" step="0.01" value="${S.pnlMult}"></label><label class="f">VWAP PnL $/bp<input type="number" id="vwapMult" step="0.01" value="${S.vwapMult}"></label></div>
  <p class="hint">Workbook constants: 41.67 (manual PnL) and 20.48 × 2 (VWAP PnL), used for meeting neutrals.</p>
  <div class="row"><button id="resetAll">Reset everything to the workbook data</button></div></section></div>`;
}
function viewAbout(){
  $("view").innerHTML=`<section class="card method"><h2>How the page prices</h2>
  <p><b>Implied meeting moves.</b> For each of the next 12 meetings, take the ZQ calendar spread around it: prior month → meeting month if the meeting is before the 15th, else meeting month → next month. Move = spread VWAP ÷ (W₁ − W₂), where W is minus the fraction of each month after the meeting day. Computed bottom-up with the workbook's adjacent-meeting correction.</p>
  <p><b>SOFR path.</b> Actual fixings for past days. For the rest of the current month, an estimate that makes the month average 100 − ZQ − SR1ZQ/100. For later months, the market average 100 − (ZQ + SR1ZQ/100). Months with a meeting are split around the day after the meeting so the month average stays the same.</p>
  <p><b>Fair values.</b> SR3 = path compounded over business days from the 3rd Wednesday to the day before the 3rd Wednesday three months later (Act/360). SR1 = monthly average of the path. ZQ = 100 − (last EFFR + cumulative implied moves), averaged over the month. Case 1/2 replace the implied moves with your hike inputs and the SR1ZQ basis.</p>
  <p><b>Checked against the workbook.</b> With the workbook's own data, all 524 cached values compared (implied cuts, the 36 rows of SR3/SR1/ZQ fair and both cases, the Graphs structures and Total Hikes) agree to 1e-8. Workbook quirks are kept on purpose so the numbers match: the intra-month split is also applied to actual fixings, the current-month block uses the last EFFR date, the 2027-03-31 Case row is kept, and only the first meeting of a month enters the SOFR path.</p>
  <p><b>Not carried over.</b> The manual-price meeting-neutral blocks (Graphs D41:K46 and D62:I65), whose ratio rows and units are inconsistent in the workbook. Meeting neutrals here are rebuilt from calendar B with ratios d / −D / D−d and gain a Fair column.</p></section>`;
}

/* ---------- events ---------- */
let raf=0;const schedule=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};
$("asof").addEventListener("change",e=>{S.asof=e.target.value===U.iso(todaySerReal())?"":e.target.value;schedule()});
$("thresh").addEventListener("input",e=>{if(e.target.value!==""){S.thresh=+e.target.value;schedule()}});
$("selA").addEventListener("change",e=>{S.selA=e.target.value;schedule()});
$("selB").addEventListener("change",e=>{S.selB=e.target.value;schedule()});
function applyQuick(){
  const m=$("quickMsg"),{dates,bad}=parseDateList($("quickDates").value,U.parts(todaySer()).y);
  if(dates.length<2){m.className="msg bad";m.textContent="Paste at least two dates, e.g. 2027-01-27 or Jan 26-27, 2027.";return}
  if(!S.scen["Announced"])S.order.push("Announced");
  S.scen["Announced"]=dates.map(U.iso);
  if(S.selA==="Announced")S.selA=S.order[0];S.selB="Announced";
  m.className="msg";m.textContent=`${dates.length} dates priced as calendar B “Announced”`+(bad.length?`. Skipped: ${bad.join(", ")}`:"");
  render();
}
$("quickApply").onclick=applyQuick;
$("quickDates").addEventListener("paste",()=>setTimeout(applyQuick,0));
$("quickDates").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();applyQuick()}});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  if(t.dataset.fam){S.fam=t.dataset.fam;render();return}
  if(t.dataset.mfam){S.matrixFam=t.dataset.mfam;render();return}
  if(t.dataset.delscen){const n=t.dataset.delscen;if(S.order.length<=1)return;delete S.scen[n];S.order=S.order.filter(x=>x!==n);render();return}
  if(t.id==="addScen"){const n=($("newScen").value||"").trim()||"Scenario "+(S.order.length+1);if(!S.scen[n]){S.scen[n]=[];S.order.push(n)}render();return}
  if(t.id==="addCase"){S.cases.rows.push({c1:"",c2:""});render();return}
  if(t.id==="addExtra"){S.cases.extra.push({date:"",c1:"",c2:""});render();return}
  if(t.id==="resetAll"){if(t.dataset.armed){S=defaults();try{localStorage.removeItem(KEY)}catch(err){}render()}else{t.dataset.armed="1";t.textContent="Click again to confirm the reset"}return}
  if(t.id==="copyView"&&lastCopy){const txt=lastCopy().map(r=>r.join("\t")).join("\n"),m=$("copyMsg");
    try{navigator.clipboard.writeText(txt).then(()=>{m.textContent="Copied. Paste into Excel."},()=>{m.textContent="The browser blocked the clipboard."})}catch(err){m.textContent="The browser blocked the clipboard."}}
});
// Edits update state as you type; the page reprices when the field is committed (blur, Tab or Enter).
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(d.scen!==undefined){const a=S.scen[d.scen]=S.scen[d.scen]||[];a[+d.i]=t.value.trim();while(a.length&&!a[a.length-1])a.pop()}
  else if(d.mkt)S.mkt[d.mkt]=t.value;
  else if(d.list)S.lists[d.list]=t.value;
  else if(d.cr!==undefined)S.cases.rows[+d.cr][d.k]=t.value.trim();
  else if(d.cx!==undefined)S.cases.extra[+d.cx][d.k]=t.value.trim();
  else if(["confirmed","sofr","effr","holidays"].includes(t.id))S[t.id]=t.value;
  else if(t.id==="cutoff")S.cases.cutoff=t.value;
  else if(t.id==="pnlMult"||t.id==="vwapMult")S[t.id]=+t.value||0;
  else return;
  save();
});
document.addEventListener("change",e=>{if(e.target.closest("#view"))schedule()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("#view input[type=text]"))e.target.blur()});
render();
</script>
</body>
